document.addEventListener('dblclick',e=>{const el=e.target.closest('[data-plot]');if(!el)return;charts.get(el.dataset.plot).domain=[...charts.get(el.dataset.plot).home];repaint(el)});
document.addEventListener('keydown',e=>{if(!e.target.matches('[data-plot] svg'))return;const el=e.target.closest('[data-plot]'),st=charts.get(el.dataset.plot),d=st.domain,dx=(d[1]-d[0])*.1,dy=(d[3]-d[2])*.1;if(e.key==='+'||e.key==='=')zoom(st,.75);else if(e.key==='-')zoom(st,1.333);else if(e.key==='ArrowLeft')st.domain=[d[0]-dx,d[1]-dx,d[2],d[3]];else if(e.key==='ArrowRight')st.domain=[d[0]+dx,d[1]+dx,d[2],d[3]];else if(e.key==='ArrowUp')st.domain=[d[0],d[1],d[2]+dy,d[3]+dy];else if(e.key==='ArrowDown')st.domain=[d[0],d[1],d[2]-dy,d[3]-dy];else return;e.preventDefault();repaint(el)});

const pages=['introduccion','grado-2','grado-4','grado-6','limites','conclusion'];
const titles=['Introducción','Grado 2','Grado 4','Grado 6','Fuera del intervalo','Conclusión'];
const powers=['','','²','³','⁴','⁵','⁶','⁷','⁸'];
const equation=m=>'ŷ = '+m.coef.map((v,i)=>(i?(v<0?' − ':' + '):v<0?'−':'')+fmt(Math.abs(v),9)+(i?'x'+powers[i]:'')).join('');
function nav(i){return `<nav><a href="#${i?pages[i-1]:'portada'}">← ${i?titles[i-1]:'Portada'}</a><span>Caso 6 · ${titles[i]}</span><a href="#portada">Inicio</a></nav>`}

function chart(m,future=false){return plot([{points:DATA.years.map((a,i)=>[a,DATA.y[i]]),color:'#493724',label:'Datos observados'},{points:m.curve.filter(p=>future||p[0]<=1990),color:'#356c87',line:true,label:'Grado '+m.degree}])}
const textByDegree={2:['Un primer intento: una parábola','El grado 2 permite curvatura, pero tiene poca flexibilidad para representar tanto el crecimiento como el cambio final de tendencia.','La curva suaviza demasiado los cambios de la serie. Sus residuos forman secuencias: no quedan dispersos sin estructura alrededor de cero. Después de 1990 sigue creciendo, a pesar del descenso en los últimos datos.'],4:['Más flexibilidad, todavía insuficiente','Con cinco coeficientes, el grado 4 se adapta mejor al cambio de tendencia. El error baja, aunque todavía quedan diferencias importantes.','La mejora de r² respecto del grado 2 no elimina los errores sistemáticos. La curva puede girar, pero aún no reproduce bien toda la transición. Su caída fuera de la muestra tampoco es una predicción validada.'],6:['Grado 6: nuestra elección para describir la serie','Con siete coeficientes, el polinomio acompaña mejor el crecimiento y la curvatura del tramo final. Lo elegimos como curva descriptiva para 1880–1990 al considerar en conjunto el error y la estabilidad frente al grado 8. No es una ley física de la producción de petróleo ni un modelo confiable de producción futura.','El error típico baja a unas 878 unidades. Todavía hay estructura y errores apreciables en los residuos: el ajuste no es perfecto. Frente al grado 8, el grado 6 sacrifica algo de ajuste para ganar estabilidad al retirar observaciones.']};
function practice(degree){let m=DATA.models.find(m=>m.degree===degree),t=textByDegree[degree];return `<div class="eyebrow">PRÁCTICA · LOS MISMOS 28 DATOS · 1880–1990</div><h2>${t[0]}</h2><p>${t[1]}</p><div class="grid"><div class="stat"><strong>${fmt(m.r2,5)}</strong><span>r² · escala original</span></div><div class="stat"><strong>${fmt(m.rmse,2)}</strong><span>RMSE · unidades de la tabla</span></div></div>${chart(m)}<div class="formula">${timeMath()}<br>${polyMath(m)}</div><p>${t[2]}</p>${development(m)}<details><summary>Ver gráfico de residuos y valores calculados</summary><p><strong>Cómo leerlo:</strong> cada punto muestra la diferencia entre la producción observada y la calculada por la curva (residuo = observado − ajustado). Por encima de cero, el modelo estima de menos; por debajo, estima de más. Cuanto más cerca de cero, menor es el error.</p><p><strong>Qué muestra este ajuste:</strong> ${degree===2?'los errores presentan un patrón marcado: la parábola no acompaña bien los cambios de la serie. Esto indica que el grado 2 tiene poca flexibilidad para estos datos.':degree===4?'los errores son menores en conjunto que con grado 2, pero todavía hay secuencias de puntos del mismo lado de cero. Quedan cambios de la serie que la curva no representa bien.':'los errores se reducen en conjunto respecto de los grados 2 y 4, aunque aún quedan desvíos y cierta estructura. Describe mejor los datos observados, pero esto no garantiza predicciones confiables después de 1990.'}</p><p>Buscamos residuos pequeños y repartidos a ambos lados de cero, sin una forma sistemática. Las rachas o curvas en este gráfico pueden señalar un comportamiento que el ajuste no está captando.</p>${plot([{points:DATA.years.map((a,i)=>[a,m.res[i]]),color:'#356c87'}],true)}${table(['Año','Observado','Ajustado','Residuo'],DATA.years.map((a,i)=>[a,fmt(DATA.y[i],0),fmt(m.pred[i],2),fmt(m.res[i],2)]))}</details>`}
function limits(degree=8){let m=DATA.models.find(m=>m.degree===degree);return `<div class="eyebrow">EL LÍMITE · EXTRAPOLAR NO ES AJUSTAR</div><h2>¿Qué ocurre después de 1990?</h2><p>Dentro de la muestra, aumentar el grado puede acercar la curva a los puntos. Fuera del intervalo, las potencias altas crecen rápidamente y los datos ya no restringen la forma de la curva.</p>${plot([{points:DATA.years.map((a,i)=>[a,DATA.y[i]]),color:'#493724',label:'Datos observados'},...DATA.models.map((model,j)=>({points:model.curve,color:['#397a9d','#ba8032','#667946','#a45069'][j],line:true,label:'Grado '+model.degree}))],false,5000,[1874,2016,-3000,31500])}<div class="note">La zona sombreada después de 1990 contiene las extrapolaciones matemáticas de los cuatro grados. No representa producción histórica comprobada. Las curvas comparten la misma escala. Podés ocultarlas individualmente y ajustar la vista a las que dejés visibles.</div><h3>Cuatro curvas, cuatro futuros distintos</h3><div class="note"><strong>Estas son extrapolaciones matemáticas, no estimaciones físicamente confiables.</strong> En particular, los valores negativos del grado 6 para 2000 y 2006 indican que el modelo pierde sentido físico fuera de la muestra. Una producción negativa no tiene interpretación real.</div><p>El grado 2 prolonga el crecimiento; el grado 4 gira hacia abajo. El grado 6 llega a valores negativos para 2000, imposibles como producción. El grado 8 se dispara hacia arriba: mejora el ajuste histórico, pero muestra mucha sensibilidad y una extrapolación poco confiable.</p>${table(['Año',...DATA.models.map(v=>'Grado '+v.degree)],[1995,2000,2006].map((a,j)=>[a,...DATA.models.map(v=>fmt(v.future[j],0))]))}<details><summary>Ver el desarrollo del grado 8</summary>${development(DATA.models.find(v=>v.degree===8))}</details><h3>Una comprobación adicional de estabilidad</h3>${table(['Grado','r²','RMSE de ajuste','RMSE al retirar un dato'],DATA.models.map(m=>[m.degree,fmt(m.r2,5),fmt(m.rmse,1),fmt(m.loo,1)]))}<p>Retiramos una observación, ajustamos con las otras 27 y predecimos el punto omitido; repetimos 28 veces. El grado 6 tiene el menor error de este control entre los candidatos. El grado 8 es mucho más sensible.</p><p>Este control no es una validación temporal del futuro. Tampoco una extrapolación extraña demuestra por sí sola sobreajuste: el riesgo se evalúa junto con la complejidad y la sensibilidad del modelo.</p>`}

function matrixNumber(v){return Math.abs(v)>=1e7?v.toExponential(5).replace('.',',').replace('e+',' × 10^'):fmt(v,5)}
function matrix(rows){return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo stretchy="true">[</mo><mtable columnalign="right" columnspacing="1em" rowspacing="0.55em">${rows.map(r=>`<mtr>${r.map(v=>`<mtd>${mathToken(String(v))}</mtd>`).join('')}</mtr>`).join('')}</mtable><mo stretchy="true">]</mo></mrow></math>`}
function development(m){let d=m.degree;return `<section class="development"><div class="eyebrow">DESARROLLO · GRADO ${d}</div><h3>Del sistema a los coeficientes</h3><div class="formula">${timeMath()}${mathBlock('<msub><mi>p</mi><mn>'+d+'</mn></msub><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo>'+Array.from({length:d+1},(_,j)=>(j?'<mo>+</mo>':'')+'<msub><mi>a</mi><mn>'+j+'</mn></msub>'+(j?(j===1?'<mi>x</mi>':'<msup><mi>x</mi><mn>'+j+'</mn></msup>'):'')).join(''))}${mathBlock('<mfrac><mrow><mo>∂</mo><mi>S</mi></mrow><mrow><mo>∂</mo><msub><mi>a</mi><mi>j</mi></msub></mrow></mfrac><mo>=</mo><mn>0</mn>')}<small>j = 0, …, ${d}</small></div><h3>1. Sistema de ecuaciones normales</h3><div class="matrix-scroll" tabindex="0" aria-label="Sistema matricial de grado ${d}"><div class="matrix-equation">${matrix(m.normal.map(r=>r.map(matrixNumber)))}${matrix(m.coef.map((_,j)=>['a'+['₀','₁','₂','₃','₄','₅','₆','₇','₈'][j]]))}<span>=</span>${matrix(m.rhs.map(v=>[matrixNumber(v)]))}</div></div><p class="matrix-caption">${d+1} ecuaciones · ${d+1} incógnitas · 28 observaciones. Valores mostrados redondeados; × 10^k indica notación científica.</p><h3>2. Coeficientes resueltos</h3><div class="matrix-scroll"><div class="matrix-equation">${matrix(m.coef.map((_,j)=>['a'+['₀','₁','₂','₃','₄','₅','₆','₇','₈'][j]]))}<span>≈</span>${matrix(m.coef.map(v=>[fmt(v,9)]))}</div></div><h3>3. Polinomio resultante</h3><div class="formula">${polyMath(m)}</div><p class="matrix-caption">La resolución numérica utiliza mínimos cuadrados con escalado de columnas, sin invertir explícitamente la matriz normal. Las curvas usan los coeficientes completos.</p></section>`}


function mathBlock(body){return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow>${body}</mrow></math>`}
function sumSymbol(v,lo,hi){return `<munderover><mo>∑</mo><mrow><mi>${v}</mi><mo>=</mo><mn>${lo}</mn></mrow><mi>${hi}</mi></munderover>`}
function timeMath(){return mathBlock('<mi>x</mi><mo>=</mo><mfrac><mrow><mtext>año</mtext><mo>−</mo><mn>1880</mn></mrow><mn>10</mn></mfrac>')}
function mathToken(v){if(v.startsWith('a'))return '<msub><mi>a</mi><mn>'+v.slice(1).replace(/[₀-₈]/g,c=>'₀₁₂₃₄₅₆₇₈'.indexOf(c))+'</mn></msub>';if(v.includes(' × 10^')){let [a,b]=v.split(' × 10^');return '<mn>'+a+'</mn><mo>×</mo><msup><mn>10</mn><mn>'+b+'</mn></msup>'}return '<mn>'+v+'</mn>'}
function polyMath(m){return '<div class="polynomial-lines" aria-label="Polinomio de grado '+m.degree+'">'+m.coef.map((v,j)=>'<span class="poly-term">'+mathBlock((j?'<mo>'+(v<0?'−':'+')+'</mo>':'<mover><mi>y</mi><mo>^</mo></mover><mo>=</mo>'+(v<0?'<mo>−</mo>':''))+'<mn>'+fmt(Math.abs(v),6)+'</mn>'+(j?(j===1?'<mi>x</mi>':'<msup><mi>x</mi><mn>'+j+'</mn></msup>'):''))+'</span>').join('')+'</div>'}
function render(){let i=pages.indexOf(location.hash.slice(1));if(i<0){$('#app').innerHTML=cover();window.scrollTo(0,0);return;}let s='';if(i===0)s=`<section><div class="eyebrow">INTRODUCCIÓN · EL PETRÓLEO A TRAVÉS DEL TIEMPO</div><h2>Introducción al Caso 6</h2><p>Al grupo 12 nos tocó trabajar con el <strong>Caso 6: Producción de petróleo</strong>, del trabajo práctico de Mínimos Cuadrados de la cátedra de Análisis Numérico de la UTN, Facultad Regional La Plata.</p><p>El ejercicio nos da una tabla con 28 observaciones de producción mundial de petróleo entre 1880 y 1990. Los valores muestran un crecimiento durante gran parte del período y una caída hacia el final. Nuestro trabajo consiste en representar esos datos, buscar una función que los describa y evaluar qué tan bien se ajusta.</p><p>También debemos estimar la producción para 1995, 2000 y 2006, y analizar si tiene sentido usar la misma función fuera del período de la tabla.</p><h3>Los datos, antes de dibujar una curva</h3><p>Cada punto representa una observación: el año en el eje horizontal y la producción en el vertical. Todavía no hay un ajuste; esta es la nube de puntos que queremos describir.</p><div class="intro-data-grid"><div>${plot([{points:DATA.years.map((a,i)=>[a,DATA.y[i]]),color:'#493724'}],false,5000)}</div><details class="intro-data-table"><summary>Ver tabla · 1880–1990</summary><p>28 observaciones · unidades de la tabla original.</p>${table(['Año','Producción'],DATA.years.map((a,i)=>[a,fmt(DATA.y[i],0)]))}</details></div><h3>¿Qué hacemos con mínimos cuadrados?</h3><p>En el gráfico, cada punto es un dato del ejercicio. Queremos dibujar una curva que pase cerca de esos puntos y nos ayude a ver la tendencia del conjunto.</p><p>Para comparar una curva con los datos, miramos a qué distancia vertical queda de cada punto: cuánto se pasa por arriba o cuánto queda por debajo. Esa diferencia es el <strong>error</strong> o <strong>residuo</strong>.</p><p>El método de <strong>mínimos cuadrados</strong> multiplica cada diferencia por sí misma y después suma los resultados. Así, las diferencias de arriba y de abajo no se cancelan, y los errores grandes pesan más. Ajustamos la curva hasta que esa suma sea lo más pequeña posible para el tipo de función elegido.</p><h3>¿Por qué elegimos un polinomio?</h3><p>En nuestros datos, la producción no sigue siempre el mismo ritmo: al principio crece, luego aumenta con más fuerza y, hacia el final, se frena y desciende. Para describir toda la serie con una sola función necesitamos una curva que pueda <strong>cambiar de pendiente y de curvatura</strong>.</p><p>Una recta mantiene una pendiente constante. Un exponencial o una función potencial, en la forma simple considerada y en su dominio positivo, mantienen una tendencia creciente o decreciente y no pueden reproducir por sí solos ese giro. Un polinomio sí permite representar un crecimiento seguido de un máximo y una caída, y sus coeficientes se pueden calcular por mínimos cuadrados.</p><div class="note"><strong>Por eso lo elegimos como familia de modelos para comparar, no como una respuesta garantizada.</strong> Probamos distintos grados y revisamos los gráficos, los residuos y los errores para decidir cuánta flexibilidad hace falta. Su utilidad aquí es describir el período observado; no supone que la producción siga una ley polinómica ni garantiza buenas predicciones después de 1990.</div><h3>¿Y si le damos más libertad a la curva?</h3><p>Un polinomio de grado bajo tiene menos flexibilidad. Al subir el grado, puede acompañar cambios más marcados. Pero al intentar acercarnos a los datos con un error cada vez menor, podemos generar una curva que se adapte demasiado a las variaciones particulares de esos puntos. Esto se llama <strong>sobreajuste</strong>: mejora el resultado sobre los datos conocidos, pero puede volver la curva inestable y producir estimaciones poco confiables fuera de ellos.</p><p>Vamos a verlo paso a paso: comenzamos con <strong>grado 2</strong>, seguimos con <strong>grado 4</strong> y llegamos al <strong>grado 6</strong>. Después probamos el grado 8 y miramos qué pasa cuando las curvas avanzan más allá de 1990.</p><div class="note">La pregunta que nos acompaña: <strong>si una curva explica bien el pasado, ¿alcanza para confiar en lo que predice?</strong></div><h3>La teoría detrás de la curva</h3><p>Tomamos <strong>x = (año − 1880)/10</strong>: x cuenta las décadas transcurridas desde 1880. Así, 1880 corresponde a x = 0, 1900 a x = 2 y 1990 a x = 11. La producción observada se representa con y.</p><div class="formula">${mathBlock('<msub><mi>p</mi><mi>m</mi></msub><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo>'+sumSymbol('j','0','m')+'<msub><mi>a</mi><mi>j</mi></msub><msup><mi>x</mi><mi>j</mi></msup>')}${mathBlock('<msub><mi>e</mi><mi>i</mi></msub><mo>=</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><msub><mi>p</mi><mi>m</mi></msub><mo>(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>)</mo>')}${mathBlock('<mi>S</mi><mo>=</mo>'+sumSymbol('i','1','28')+'<msup><mrow><mo>[</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><msub><mi>p</mi><mi>m</mi></msub><mo>(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>)</mo><mo>]</mo></mrow><mn>2</mn></msup><mo>→</mo><mtext>mínimo</mtext>')}</div><p>El grado m determina cuántos coeficientes buscamos: m + 1. Al derivar S respecto de cada coeficiente e igualar a cero obtenemos un sistema de ecuaciones, llamado <strong>sistema de ecuaciones normales</strong>.</p><div class="formula">${mathBlock('<mfrac><mrow><mo>∂</mo><mi>S</mi></mrow><mrow><mo>∂</mo><msub><mi>a</mi><mi>k</mi></msub></mrow></mfrac><mo>=</mo><mn>0</mn>')}${mathBlock(sumSymbol('j','0','m')+'<mo>(</mo>'+sumSymbol('i','1','28')+'<msubsup><mi>x</mi><mi>i</mi><mrow><mi>k</mi><mo>+</mo><mi>j</mi></mrow></msubsup><mo>)</mo><msub><mi>a</mi><mi>j</mi></msub><mo>=</mo>'+sumSymbol('i','1','28')+'<msubsup><mi>x</mi><mi>i</mi><mi>k</mi></msubsup><msub><mi>y</mi><mi>i</mi></msub>')}<small>k = 0, …, m</small></div><p>Resolverlo nos da los coeficientes de la curva. Luego revisamos los residuos y calculamos dos medidas para comparar los grados:</p><div class="formula">${mathBlock('<msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow>'+sumSymbol('i','1','28')+'<msubsup><mi>e</mi><mi>i</mi><mn>2</mn></msubsup></mrow><mrow>'+sumSymbol('i','1','28')+'<msup><mrow><mo>(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover><mi>y</mi><mo>¯</mo></mover><mo>)</mo></mrow><mn>2</mn></msup></mrow></mfrac>')}${mathBlock('<mi mathvariant="normal">RMSE</mi><mo>=</mo><msqrt><mfrac><mrow>'+sumSymbol('i','1','28')+'<msubsup><mi>e</mi><mi>i</mi><mn>2</mn></msubsup></mrow><mn>28</mn></mfrac></msqrt>')}</div><p>Un r² más cercano a 1 indica un mejor ajuste a estos datos; un RMSE menor indica errores más pequeños en las unidades de producción. Ninguna de las dos medidas garantiza que la curva prediga bien fuera del período observado.</p><a class="card" href="#grado-2"><span class="eyebrow">VAMOS A LOS DATOS</span><h3>Primer ajuste · Grado 2 →</h3></a></section>`;
if(i>=1&&i<=3)s=practice([2,4,6][i-1]);if(i===4)s=limits();if(i===5)s=`<div class="eyebrow">CONCLUSIÓN DEL CASO</div><h2>Grado 6 para describir, cautela para predecir</h2><p>Trabajamos con una única serie de 28 puntos. El grado 2 resulta demasiado rígido, el 4 mejora la curvatura y el 6 reduce el error de forma importante: r² = 0,98860 y RMSE ≈ 878,36 unidades.</p><p>Elegimos el grado 6 como compromiso descriptivo entre ajuste y estabilidad entre los candidatos comparados, no como el mejor modelo para estimar producción futura. El grado 8 obtiene mayor r² y menor RMSE de ajuste; la ventaja del grado 6 está en su menor sensibilidad al retirar observaciones. El grado 8 mejora todavía más el r², pero es mucho más sensible al retirar puntos. Aumentar el grado no equivale automáticamente a mejorar el modelo.</p><div class="formula">Describir 1880–1990 ≠ predecir después de 1990</div><p>El grado 6 arroja producción negativa para 2000 y 2006. Esos valores no representan producción real: son evidencia de que el modelo no debe extrapolarse tan lejos. Por ello, este ajuste polinómico no es adecuado para realizar predicciones de largo plazo fuera de 1880–1990. Tampoco la estimación positiva de 1995 queda validada por su signo.</p><h3>Cierre visual · extrapolación después de 1990</h3><p>Activá los cuatro grados y alterná entre «1880–1990» y «Ver extrapolación». Dentro del período, las curvas acompañan los datos; después de 1990, el grado 6 cae a valores negativos y el grado 8 crece bruscamente. Esa divergencia muestra el límite de estos ajustes.</p>${plot([{points:DATA.years.map((a,i)=>[a,DATA.y[i]]),color:'#493724',label:'Datos observados'},...DATA.models.map((m,i)=>({points:m.curve,color:['#397a9d','#ba8032','#667946','#a45069'][i],line:true,label:'Grado '+m.degree}))],false,5000,[1874,2016,-3000,31500])}<div class="note"><strong>Un buen ajuste histórico no garantiza capacidad predictiva en el futuro.</strong> Las curvas son aproximaciones a estos datos, no leyes de la producción de petróleo.</div><details><summary>Fuentes y unidades</summary><p>Los datos provienen del <em>Trabajo Práctico Nº 4, ejercicio 6: Producción de petróleo</em>, páginas 3–4. El procedimiento se apoya en la <em>Teoría de Ajuste por Mínimos Cuadrados</em> de la cátedra. El guion y README recibidos se usaron como contexto; todos estos ajustes se recalcularon.</p><p>El enunciado dice «billones de barriles» y las guías auxiliares dicen «millones». Conservamos las unidades numéricas de la tabla sin aplicar una conversión no verificada. El máximo observado es 21.922 en 1978.</p><details><summary>Ver los 28 datos originales</summary>${table(['Año','Producción'],DATA.years.map((a,i)=>[a,fmt(DATA.y[i],0)]))}</details><p>Los coeficientes se muestran redondeados. Gráficos, errores y extrapolaciones utilizan la precisión completa.</p></details>`;

function fitMath(){document.querySelectorAll('.polynomial-lines').forEach(row=>{const terms=[...row.querySelectorAll('.poly-term')];terms.forEach((term,i)=>{term.classList.toggle('continues',!!terms[i+1]&&terms[i+1].getBoundingClientRect().top>=term.getBoundingClientRect().bottom-2);term.classList.toggle('continued',!!terms[i-1]&&term.getBoundingClientRect().top>=terms[i-1].getBoundingClientRect().bottom-2);});});document.querySelectorAll('.formula > math,.matrix-equation').forEach(el=>{el.style.zoom='1';const parent=el.parentElement,style=getComputedStyle(parent),space=parent.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-12;if(space<=0)return;const natural=Math.max(el.scrollWidth,el.getBoundingClientRect().width);let scale=Math.min(1,space/natural);el.style.zoom=String(scale);const actual=el.getBoundingClientRect().width;if(actual>space)el.style.zoom=String(scale*space/actual);});}
